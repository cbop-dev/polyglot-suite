[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-pipeline-core"
version = "0.1.0"
description = "Core Python data pipeline utilities for Polyglot Suite ancient text readers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline_core*"]
