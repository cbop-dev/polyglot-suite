name: Deploy Polyglot Suite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Database Chunks
        id: db-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/polyglot-bible-reader/static/db/polyglot.db.*
            apps/philo-reader/static/db/philo.db.*
            apps/apostolic-fathers-reader/static/db/af.db.*
          key: polyglot-dbs-${{ hashFiles('apps/*/static/db/config.json') }}

      - name: Fetch Database Chunks
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pull:db

      - name: Build Polyglot Suite (Apps & Portal)
        run: npm run build:www

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
